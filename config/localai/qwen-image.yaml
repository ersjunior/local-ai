# DEFINIÇÃO REAL de modelo do LocalAI (backend diffusers) — servida em /models.
# NÃO confundir com config/models/ (catálogo/documentação, montado em /catalog:ro).
#
# ALTERNATIVA (não é o padrão). Melhor para TEXTO RENDERIZADO PELO MODELO dentro
# da imagem — mas ~20B, exige mais VRAM e é arriscado em f16 no single RTX 4090.
# O padrão do projeto é flux-dev (ver config/localai/flux-dev.yaml).
# Licença: Qwen-Image (uso comercial permitido, com restrições — verificar LICENSE).
#
# PARA USAR ESTE MODELO: no gateway (config/gateway/config.yaml), na rota
# image-thumbs, troque `model: openai/flux-dev` por `model: openai/qwen-image`
# e reinicie o gateway (docker compose restart gateway).
#
# Formato conferido na doc do LocalAI (backend diffusers) — localai.io.
name: qwen-image
backend: diffusers

# GPU: habilite f16 + cuda (topo) e diffusers.cuda (aninhado).
f16: true
cuda: true

# Passos de difusão (default do modelo). Ajuste conforme qualidade/tempo.
step: 20

parameters:
  # ID do repositório no HuggingFace (baixado sob demanda para /models).
  model: Qwen/Qwen-Image

diffusers:
  cuda: true
  # Classe da pipeline no diffusers. Se a sua versão não tiver QwenImagePipeline,
  # troque para flux-dev ou flux-schnell (FluxPipeline) — ver comentário no topo.
  pipeline_type: QwenImagePipeline
  # Guidance scale. Ajuste se as imagens saírem "lavadas" ou saturadas.
  cfg_scale: 4.0
  enable_parameters: "negative_prompt,num_inference_steps"

# NOTA (edição/img2img): images.edit pode não existir na API do LocalAI.
# Projetos consumidores devem cair para images.generate (text2img).
# Para edição fiel (img2img), usar ComfyUI (TODO em services/).
