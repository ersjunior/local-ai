# CATÁLOGO — fonte de verdade / documentação de um modelo.
# A definição REAL servida pelo LocalAI está em config/localai/flux-schnell.yaml.
# Ao adicionar um arquivo aqui, adicione TAMBÉM a rota em
# config/gateway/config.yaml (model_list). O scripts/add-model.sh ajuda.

logical_name: image-thumbs           # ALTERNATIVA ao padrão (flux-dev)
backend: localai
model_id: flux-schnell
alias: ""
params:
  size: "1024x1024"
  steps: 4                           # schnell é distilado: 4 passos bastam
  cfg_scale: 0
vram_estimate: "~cabe no 24GB (12B, distilado, low_vram)"
license: "Apache-2.0 (FLUX.1-schnell). Repo HF é gated: requer HUGGING_FACE_HUB_TOKEN."
notes: >
  ALTERNATIVA comercial ao flux-dev (Apache-2.0). Mais rápido (4 passos), qualidade
  inferior ao dev. Para ativar, troque a rota image-thumbs no gateway para
  openai/flux-schnell. Padrão ativo: image-flux-dev.yaml.
enabled: false
