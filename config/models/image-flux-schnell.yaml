# CATÁLOGO — fonte de verdade / documentação de um modelo.
# A definição REAL servida pelo LocalAI está em config/localai/flux-schnell.yaml.
# Ao adicionar um arquivo aqui, adicione TAMBÉM a rota em
# config/gateway/config.yaml (model_list). O scripts/add-model.sh ajuda.

logical_name: image-thumbs           # nome lógico ATIVO (padrão do projeto)
backend: localai
model_id: flux-schnell
alias: ""
params:
  size: "1024x1024"
  steps: 4                           # schnell é distilado: 4 passos bastam
  cfg_scale: 0
vram_estimate: "~cabe no 24GB (12B, distilado, low_vram) — modelo de imagem PADRÃO"
license: "Apache-2.0 (FLUX.1-schnell). Repo HF é gated: requer HUGGING_FACE_HUB_TOKEN."
notes: >
  PADRÃO do projeto para image-thumbs. Texto do título é baked pelo app (PIL),
  então não precisamos da renderização de texto do Qwen-Image. FLUX.1-schnell
  cabe e é confiável no single RTX 4090. Alternativa: image-qwen.yaml.
enabled: true
