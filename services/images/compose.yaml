# services/images/compose.yaml
#
# Backend de imagem -> LocalAI (Diffusers, CUDA).
# Expõe /v1/images/generations (OpenAI-compatível).
#
# BACKENDS OCI (diffusers):
#   Na imagem localai/localai:latest-gpu-nvidia-cuda-12 os backends NÃO vêm embutidos.
#   O backend cuda12-diffusers é uma imagem OCI à parte, instalada em /backends.
#   LOCALAI_EXTERNAL_BACKENDS=cuda12-diffusers faz o download automático no arranque.
#   O volume localai_backends persiste /backends entre recreates do container.
#
# CATÁLOGO vs DEFINIÇÃO REAL (importante):
#   - config/models/  = CATÁLOGO (documentação). Montado em /catalog:ro. NÃO é
#     lido pelo LocalAI como modelo — serve só de fonte de verdade/docs.
#   - config/localai/ = DEFINIÇÃO REAL servida pelo LocalAI. Montado em /models
#     (leitura/escrita). Contém os .yaml (flux-dev) que o LocalAI carrega de fato;
#     LocalAI carrega de fato; os PESOS baixados também caem aqui (ignorados
#     pelo git — ver .gitignore).
#
# NOTA (edição de imagem / img2img):
#   images.edit (img2img) pode NÃO existir nesta API. Projetos consumidores
#   devem cair para images.generate (text2img). Para edição fiel, usar ComfyUI.
#   TODO: adicionar um serviço services/comfyui/compose.yaml para img2img fiel.
#
# Orçamento de VRAM (single 4090): a imagem só deve carregar sob demanda.
# Mantenha o LLM (Ollama) descarregado antes de gerar imagem (keep_alive curto).
services:
  images:
    image: localai/localai:latest-gpu-nvidia-cuda-12
    container_name: localai-images
    restart: unless-stopped
    # Perfil image: só sobe com `make up-all`. Sem profile, subiria SEMPRE (VRAM!).
    profiles: ["image"]
    # Porta no host: 18002 -> 8080 no container (rota direta opcional).
    ports:
      - "${IMAGES_PORT:-18002}:8080"
    environment:
      MODELS_PATH: "/models"
      DEBUG: "${LOCALAI_DEBUG:-false}"
      # Respeita f16/low_vram do YAML do modelo (evita auto-tuning sobrescrever).
      LOCALAI_DISABLE_HARDWARE_DEFAULTS: "true"
      LOCALAI_EXTERNAL_BACKENDS: "${LOCALAI_EXTERNAL_BACKENDS:-cuda12-diffusers}"
      # Token HF para modelos gated (ex.: FLUX.1-dev, FLUX.1-schnell). Obrigatório para flux-dev.
      HF_TOKEN: "${HUGGING_FACE_HUB_TOKEN:-}"
      HUGGING_FACE_HUB_TOKEN: "${HUGGING_FACE_HUB_TOKEN:-}"
      # Cache HF no volume montado (pesos FLUX persistem entre recreates).
      HF_HOME: "/models"
      # Evita manter LLM de imagem + outros backends em VRAM ao mesmo tempo.
      LOCALAI_MAX_ACTIVE_BACKENDS: "1"
    volumes:
      - ../../config/localai:/models
      - ../../config/models:/catalog:ro
      # Persiste backends OCI (cuda12-diffusers) — evita reinstalar a cada recreate.
      - localai_backends:/backends
    networks:
      - localai_net
    healthcheck:
      # /readyz responde quando o processo está up; o backend diffusers pode ainda
      # estar a descarregar na 1ª subida (ver start_period).
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/readyz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  localai_backends:

networks:
  localai_net:
    external: true
    name: localai_net
